<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
    <style>
        :root {
            --cream: #f7f3ee;
            --ink: #1a1714;
            --muted: #7a7168;
            --accent: #c8552a;
            --rule: #d9d2c8;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            background: var(--cream);
            color: var(--ink);
            font-family: 'DM Mono', monospace;
            font-weight: 300;
            line-height: 1.7;
            min-height: 100vh;
        }

        /* ── HEADER ── */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4rem;
            border-bottom: 1px solid var(--rule);
            animation: fadeDown .6s ease both;
        }

        .site-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            letter-spacing: .04em;
        }

        nav a {
            font-size: .75rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            margin-left: 2rem;
            transition: color .2s;
        }
        nav a:hover { color: var(--accent); }

        /* ── MAIN CONTENT ── */
        main {
            padding: 5rem 4rem;
            animation: fadeUp .7s ease .2s both;
        }

        .section-label {
            font-size: .7rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 2.5rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 3.5rem);
            line-height: 1.1;
            margin-bottom: 3rem;
        }

        /* ── FOOTER ── */
        footer {
            padding: 2rem 4rem;
            border-top: 1px solid var(--rule);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: .72rem;
            color: var(--muted);
            letter-spacing: .06em;
        }

        footer a { color: inherit; text-decoration: none; transition: color .2s; }
        footer a:hover { color: var(--accent); }

        /* ── ANIMATIONS ── */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 860px) {
            header { padding: 1.5rem 2rem; }
            header nav { display: none; }

            main { padding: 3rem 2rem; }

            footer { padding: 1.5rem 2rem; flex-direction: column; gap: .5rem; text-align: center; }
        }
    </style>
</head>
<body>
    <!-- ── HEADER ── -->
    <header>
        <div class="site-name">Your Name</div>
        <nav>
            <a href="index.html">About</a>
            <a href="resume.html">Resume</a>
            <a href="projects.html">Projects</a>
            <a href="courses.html">Courses</a>
        </nav>
    </header>

    <!-- ── MAIN CONTENT ── -->
    <main>
        <p class="section-label">Portfolio</p>
        <h1>My Projects</h1>
        <!-- Add your projects content here -->
    </main>

    <!-- ── FOOTER ── -->
    <footer>
        <span>© 2026 Your Name</span>
        <span>
            <a href="mailto:you@email.com">Email</a> &nbsp;·&nbsp;
            <a href="https://github.com/yourusername">GitHub</a> &nbsp;·&nbsp;
            <a href="your-cv.pdf">CV</a>
        </span>
    </footer>
</body>
</html>
