<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
 
        body {
            font-family: Georgia, serif;
            font-size: 16px;
            line-height: 1.7;
            color: #222;
            background: #fff;
        }
 
        /* NAV */
        #nav-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1rem 2rem;
            border-bottom: 2px solid #0051a2;
        }
 
        #KU_LOGO { height: 48px; }
 
        #title {
            font-size: 1.1rem;
            font-weight: normal;
            margin-right: auto;
        }
 
        #nav-list {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
 
        .nav-item a {
            text-decoration: none;
            color: #0051a2;
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
        }
        .nav-item a:hover { text-decoration: underline; }
        #active-url a { font-weight: bold; }
        .divider { color: #aaa; }
 
        /* PAGE */
        #page-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem;
        }
 
        /* SECTIONS */
        .section {
            display: block;
            margin-bottom: 2rem;
        }
 
        .section-heading {
            font-size: 1rem;
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #0051a2;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.3rem;
            margin-bottom: 0.8rem;
        }
 
        .section-text {
            font-size: 0.95rem;
            color: #333;
        }
 
        /* FOOTER */
        footer {
            margin-top: 4rem;
            padding-top: 1rem;
            border-top: 1px solid #ddd;
            font-family: Arial, sans-serif;
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
        }
 
        @media (max-width: 700px) {
            #nav-list { display: none; }
        }
    </style>
</head>
<body>
    <header id='nav-container'>
        <a id='img-container' href="index.html"><img id='KU_LOGO' src="KUMarks_Jayhawk.png"></a>
        <h3 id="title">Joshua O'Connor</h3>
        <ul id='nav-list'>
            <li class='nav-item'><a href="index.html">About</a></li>
            <li class="nav-item divider">|</li>
            <li class='nav-item' id='active-url'><a href="resume.html">Resume</a></li>
            <li class="nav-item divider">|</li>
            <li class='nav-item'><a href="projects.html">Projects</a></li>
            <li class="nav-item divider">|</li>
            <li class='nav-item'><a href="courses.html">Courses</a></li>
        </ul>
    </header>
    <div id="page-container">
        <!-- Add your resume content here -->
    </div>
    <footer>© 2026 Joshua O'Connor</footer>
</body>
</html>
