<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} — Joshua O'Connor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, serif;
      font-size: 16px;
      line-height: 1.7;
      color: #222;
      background: #fff;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1rem 2rem;
      border-bottom: 2px solid #0051a2;
    }

    nav .logo {
      height: 44px;
    }

    nav .site-title {
      font-family: Georgia, serif;
      font-size: 1rem;
      font-weight: normal;
      margin-right: auto;
      text-decoration: none;
      color: #222;
    }

    nav ul {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    nav ul li a {
      text-decoration: none;
      color: #0051a2;
      font-family: Arial, sans-serif;
      font-size: 0.88rem;
      padding: 0.2rem 0.4rem;
    }
    nav ul li a:hover { text-decoration: underline; }
    nav ul li a.active { font-weight: bold; }
    nav ul li.divider { color: #ccc; }

    /* PAGE */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.3rem;
    }

    h2 {
      font-family: Arial, sans-serif;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #0051a2;
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.3rem;
      margin: 2rem 0 0.8rem;
    }

    p { color: #333; margin-bottom: 0.8rem; }

    a { color: #0051a2; }

    footer {
      max-width: 900px;
      margin: 3rem auto 1.5rem;
      padding: 1rem 2rem 0;
      border-top: 1px solid #ddd;
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      color: #aaa;
    }

    @media (max-width: 600px) {
      nav ul { display: none; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/"><img class="logo" src="/tableau.svg" alt="KU" /></a>
    <a class="site-title" href="/">Joshua O'Connor</a>
    <ul>
      <li><a href="/" {% if page.url == "/" %}class="active"{% endif %}>About</a></li>
      <li class="divider">|</li>
      <li><a href="/research/" {% if page.url contains "research" %}class="active"{% endif %}>Research</a></li>
      <li class="divider">|</li>
      <li><a href="/cv/" {% if page.url contains "cv" %}class="active"{% endif %}>CV</a></li>
    </ul>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    © {{ 'now' | date: "%Y" }} Joshua O'Connor
  </footer>

</body>
</html>
